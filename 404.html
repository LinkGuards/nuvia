<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // GitHub Pages SPA redirect: save the 404 path and redirect to /
    var path = window.location.pathname;
    var search = window.location.search;
    if (path !== "/" && path !== "/404.html") {
      sessionStorage.setItem("spa_redirect", path + search);
    }
    window.location.replace("/" + search);
  </script>
</head>
<body></body>
</html>
